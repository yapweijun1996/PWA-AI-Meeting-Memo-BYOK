name: One-time Pages publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /PWA-AI-Meeting-Memo-BYOK/
          VITE_BUILD_ID: ${{ github.sha }}
      - run: npm run check:artifact
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:pwa
      - name: Check current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
