<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaker listening concept</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#203b2d;background:#f5f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px 20px 100px}header,.toolbar,.player,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(1.55rem,4vw,2.3rem);margin:.35em 0}h2{font-size:1.1rem}p{line-height:1.55}.muted{color:#526758}.notice{background:#fff4d9;border:1px solid #e7d5a6;padding:14px;border-radius:12px}.panel{background:white;border:1px solid #d9e1d5;border-radius:18px;padding:22px;margin-top:18px}.stage{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:25px 0}.person{text-align:center;border:1px solid #d9e1d5;border-radius:15px;padding:17px 8px;min-width:0}.avatar{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;margin:0 auto 12px;background:#e6eedc;font-weight:700;color:#36583f}.person.active{border:2px solid #36734d;background:#eff8ed}.active .avatar{background:#3d7651;color:white;animation:pulse 1.4s infinite}.person strong,.person span{display:block}.person span{font-size:.83rem;margin-top:7px}.badge{font-size:.85rem;color:#576b5c}.player{background:#f3f6ef;border-radius:12px;padding:14px}.timeline{flex:1;min-width:160px}button,select{font:inherit;color:#203b2d;border:1px solid #bdcdbb;background:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #245e3d;outline-offset:3px}.primary{background:#396b49;color:white;border-color:#396b49}.controls{display:flex;gap:8px;flex-wrap:wrap}.sample{border-top:1px solid #e0e8dc;padding:15px 0}.sample p{margin:7px 0}.small{font-size:.88rem}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}input[type=range]{width:100%;accent-color:#396b49}@keyframes pulse{50%{box-shadow:0 0 0 9px #a8d4ad66}}@media(max-width:700px){main{padding:16px 14px 60px}.stage{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:16px}.person:last-child{grid-column:1/-1}.player{align-items:stretch}.timeline{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body><main>
  <header><div><div class="badge" data-i="eyebrow"></div><h1 data-i="title"></h1><p class="muted" data-i="intro"></p></div><label><span data-i="language"></span> <select id="language"><option value="en">English</option><option value="zh">简体中文</option></select></label></header>
  <p class="notice" data-i="notice"></p>
  <section class="panel" aria-labelledby="stage-title"><div class="row"><div><h2 id="stage-title" data-i="stage"></h2><p class="muted small" data-i="stageHelp"></p></div><span class="badge" data-i="unconfirmed"></span></div>
    <div class="stage" id="stage"></div>
    <div class="player"><button id="play" class="primary" type="button"></button><div class="timeline"><label for="position" class="sr-only" data-i="seek"></label><input id="position" type="range" min="0" max="30" value="0" step="1"></div><span id="time">00:00 / 00:30</span></div>
    <p id="status" role="status" aria-live="polite"></p><p class="small muted" data-i="gap"></p>
  </section>
  <section class="panel" aria-labelledby="sample-title"><div class="row"><div><h2 id="sample-title" data-i="samples"></h2><p class="muted" data-i="sampleHelp"></p></div><label><span data-i="length"></span> <select id="length"><option value="10">10 s</option><option value="20">20 s</option><option value="30">30 s</option></select></label></div>
    <div class="sample"><div class="row"><strong id="sample-name"></strong><span class="badge" id="sample-range"></span></div><p data-i="sampleText"></p><div class="controls"><button type="button" id="samplePlay" data-i="listen"></button><button type="button" id="next" data-i="next"></button></div></div>
    <p class="small muted" data-i="context"></p>
  </section>
  <section class="panel"><h2 data-i="realTitle"></h2><p data-i="realText"></p></section>
</main>
<script>
  const strings={en:{eyebrow:'MEETING MEMO · DESIGN CONCEPT',title:'See the conversation as you listen',intro:'A proposed workspace for finding and confirming voices.',language:'Interface language',notice:'Illustration only: the five speakers, text and timing are invented. This demo has no recording and does not identify voices.',stage:'Who is speaking?',stageHelp:'Highlights show example transcript labels at the current playback position.',unconfirmed:'All identities unconfirmed',seek:'Seek in simulated timeline',pause:'Pause demo',play:'Play demo',unknown:'No timed speaker evidence',speaking:'Example active label:',gap:'A gap or unavailable timing must remain unknown. Overlapping supported labels can appear together.',samples:'Listen with more context',sampleHelp:'Choose a longer window and compare examples from different turns.',length:'Window',sampleText:'Example transcript: Let’s review the next steps together.',listen:'Preview this example',next:'Next example',context:'Context may include other speakers. Confirm identity only after listening; the model label is a suggestion.',realTitle:'How this would work with your recording',realText:'The app would play your saved audio and highlight existing timestamped speaker assignments. It cannot identify a real person from an MP3 alone, and missing or inaccurate labels require review.',speaker:'Speaker',sample:'Example',sec:'s',ends:'ends at'},zh:{eyebrow:'MEETING MEMO · 设计概念',title:'边听录音，边查看谁在发言',intro:'一个帮助辨认和确认声音的工作区方案。',language:'界面语言',notice:'仅供演示：五位说话人、文字和时间均为虚构。本示例没有录音，也不会辨认声音。',stage:'谁正在发言？',stageHelp:'高亮显示当前位置的示例逐字稿标签。',unconfirmed:'所有身份均未确认',seek:'调整模拟时间轴',pause:'暂停演示',play:'播放演示',unknown:'没有带时间的说话人依据',speaking:'示例中的发言标签：',gap:'没有时间依据的位置须显示未知；有依据的重叠发言可同时显示。',samples:'听取更完整的上下文',sampleHelp:'选择较长试听范围，并比较不同发言片段。',length:'试听范围',sampleText:'示例文字：我们一起讨论下一步。',listen:'预览此示例',next:'下一个示例',context:'上下文可能包含其他人的声音。请试听后再确认身份；模型标签仅供参考。',realTitle:'实际录音将如何使用',realText:'应用将播放本地保存的录音，并根据已有时间标记高亮说话人分配。仅凭 MP3 无法确认真人身份；缺失或错误的标记需要人工检查。',speaker:'说话人',sample:'示例',sec:'秒',ends:'结束于'}};
  let lang='en',position=0,playing=false,timer=null,index=0;
  const $=id=>document.getElementById(id), t=k=>strings[lang][k], fmt=n=>`00:${String(n).padStart(2,'0')}`;
  const turns=[{start:0,end:6,ids:[0]},{start:6,end:12,ids:[1]},{start:12,end:17,ids:[2,3]},{start:19,end:24,ids:[3]},{start:24,end:30,ids:[4]}];
  function render(){document.documentElement.lang=lang==='zh'?'zh-Hans':'en';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});const active=turns.find(x=>position>=x.start&&position<x.end)?.ids||[]; $('stage').replaceChildren(...Array.from({length:5},(_,i)=>{const e=document.createElement('div');e.className='person'+(active.includes(i)?' active':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=String(i+1);const name=document.createElement('strong');name.textContent=`${t('speaker')} ${i+1}`;const state=document.createElement('span');state.textContent=active.includes(i)?t('speaking'):'—';e.append(avatar,name,state);return e}));$('play').textContent=t(playing?'pause':'play');$('position').value=position;$('time').textContent=`${fmt(position)} / 00:30`;$('status').textContent=active.length?`${t('speaking')} ${active.map(i=>`${t('speaker')} ${i+1}`).join(', ')}`:t('unknown');$('sample-name').textContent=`${t('speaker')} ${index+1} · ${t('sample')} ${index+1}`;const start=turns[[0,1,2,3,4][index]].start;$('sample-range').textContent=`${fmt(start)} – ${fmt(Math.min(30,start+Number($('length').value)))}`;}
  function pause(){playing=false;clearInterval(timer);timer=null}
  $('play').addEventListener('click',()=>{if(playing)pause();else{if(position>=30)position=0;playing=true;timer=setInterval(()=>{position++;if(position>=30)pause();render()},1000)}render()});
  $('position').addEventListener('input',e=>{position=Number(e.target.value);render()});$('language').addEventListener('change',e=>{lang=e.target.value;render()});$('length').addEventListener('change',render);$('next').addEventListener('click',()=>{index=(index+1)%5;render()});$('samplePlay').addEventListener('click',()=>{pause();position=turns[index].start;render()});render();
</script></body></html>
